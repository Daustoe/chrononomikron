[package]
name = "chrononomikron"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
bevy_ascii_terminal = "0.19.0"
rltk = { version = "0.8.7" }
rexpaint = "0.1.2"
lazy_static = "1.4.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3