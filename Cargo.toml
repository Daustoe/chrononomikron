[package]
name = "chrononomikron"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.19.1", default-features = false, features = [
    "png", "bevy_winit", "x11", "wayland", "bevy_text", "bevy_color", "bevy_state"
] }
bevy_ascii_terminal = "0.19.0"
rltk = { version = "0.8.7" }
rexpaint = "0.1.2"
lazy_static = "1.4.0"
bevy_rand = { version = "0.15.2", default-features = false, features = ["wyrand"] }
rand = "0.10.2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3